[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-rule-helper"
version = "0.1.0"
description = "Small CLI helper for reviewing Sigma detection rules"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Haitao Zheng" }]
dependencies = [
    "PyYAML>=6.0.1",
]

[project.scripts]
sigma-rule-helper = "sigma_rule_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
